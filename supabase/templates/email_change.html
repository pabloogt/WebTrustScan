<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#0b1220;font-family:Arial,Helvetica,sans-serif;color:#e2e8f0">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#0f172a;border:1px solid #1e293b;border-radius:16px">
      <tr>
        <td style="padding:28px">
          <p style="margin:0 0 20px;font-size:18px;font-weight:bold;color:#ffffff">WebTrustScan</p>
          <h1 style="margin:0 0 12px;font-size:20px;color:#ffffff">Confirma tu nuevo correo</h1>
          <p style="margin:0 0 20px;line-height:1.6">Has pedido cambiar la dirección de correo de tu cuenta de WebTrustScan. El cambio no se aplica hasta que lo confirmes.</p>
          <p style="margin:0 0 20px">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/panel"
               style="display:inline-block;padding:12px 20px;background:#ffffff;color:#0f172a;text-decoration:none;font-weight:bold;border-radius:10px">Confirmar el cambio</a>
          </p>
          <p style="margin:0;font-size:13px;line-height:1.6;color:#94a3b8">Si no has pedido este cambio, ignora este mensaje y cambia tu contraseña.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
